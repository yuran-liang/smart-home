name: CI

on:
  push:
  pull_request:

jobs:
  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml with the example .env
        working-directory: docker
        run: |
          cp .env.example .env
          docker compose config --quiet

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh

  firmware:
    name: Sensor firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('sensor/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build with the example secrets
        working-directory: sensor
        run: |
          cp include/secrets.h.example include/secrets.h
          pio run
