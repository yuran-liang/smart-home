services:
  # ===============================
  # Mosquitto (MQTT broker)
  # ===============================
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2   # Use major version 2 for stability; avoid 'latest' to prevent breaking changes (v3+)
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${DATA_DIR}/mosquitto/config:/mosquitto/config
      - ${DATA_DIR}/mosquitto/data:/mosquitto/data
      - ${DATA_DIR}/mosquitto/log:/mosquitto/log
    environment:
      - TZ=${TZ}

  # ===============================
  # Homebridge (Apple HomeKit bridge)
  # ===============================
  homebridge:
    container_name: homebridge
    image: homebridge/homebridge:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ}
    volumes:
      - ${DATA_DIR}/homebridge:/homebridge
    dns:
      - 1.1.1.1
      - 8.8.8.8

  # ===============================
  # Zigbee2MQTT (Zigbee bridge via Sonoff Dongle MG24)
  # ===============================
  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:latest
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      - TZ=${TZ}
    volumes:
      - ${DATA_DIR}/zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - ${ZIGBEE_DONGLE}:/dev/ttyUSB0

  # ===============================
  # Node-RED (Automation & Flows)
  # ===============================
  # Do not mount anything inside /data/nrchkb: node-red-contrib-homekit-bridged
  # reads every entry there every 2 minutes and crashes Node-RED on a subdirectory.
  nodered:
    container_name: nodered
    image: nodered/node-red:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ}
    volumes:
      - ${DATA_DIR}/nodered/data:/data

  # ===============================
  # Samba (external HDD as a network drive)
  # ===============================
  samba:
    container_name: samba
    image: dockurr/samba
    restart: unless-stopped
    ports:
      - "445:445"
    environment:
      - TZ=${TZ}
      - NAME=${SAMBA_SHARE}
      - USER=${SAMBA_USER}
      - PASS=${SAMBA_PASSWORD:?set SAMBA_PASSWORD in .env}
    volumes:
      # rslave: a mount of the HDD that happens after the container started (e.g. at boot)
      # still shows up inside it. No create_host_path: a missing mount point fails loudly.
      - type: bind
        source: ${HDD_DIR}
        target: /shared
        bind:
          propagation: rslave
          create_host_path: false

  # ===============================
  # Nextcloud (files, with MariaDB)
  # ===============================
  # Not updated by Watchtower: Nextcloud upgrades one major version at a time. Change
  # NEXTCLOUD_VERSION in .env and run `docker compose up -d nextcloud` for each step.
  # Cache and file locking for Nextcloud; no published port, reachable only from the stack
  nextcloud-redis:
    container_name: nextcloud-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    environment:
      - TZ=${TZ}
    labels:
      - com.centurylinklabs.watchtower.enable=false

  nextcloud-db:
    container_name: nextcloud-db
    image: mariadb:${NEXTCLOUD_DB_VERSION:-10.11}
    restart: unless-stopped
    # innodb-log-file-size: Nextcloud's database check wants at least 128 MB (the default is 96 MB)
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --innodb-log-file-size=256M
    environment:
      - TZ=${TZ}
      - MARIADB_ROOT_PASSWORD=${NEXTCLOUD_DB_ROOT_PASSWORD:?set NEXTCLOUD_DB_ROOT_PASSWORD in .env}
      # Upgrade the system tables when the data directory comes from an older major version
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DATABASE=nextclouddb
      - MARIADB_USER=nextcloud
      - MARIADB_PASSWORD=${NEXTCLOUD_DB_PASSWORD:?set NEXTCLOUD_DB_PASSWORD in .env}
    volumes:
      - nextcloud_db:/var/lib/mysql
    labels:
      - com.centurylinklabs.watchtower.enable=false

  nextcloud:
    container_name: nextcloud
    image: nextcloud:${NEXTCLOUD_VERSION:?set NEXTCLOUD_VERSION in .env}-apache
    restart: unless-stopped
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    ports:
      # Localhost only: reached through the tailscale container (HTTPS), not directly from the LAN
      - "127.0.0.1:${NEXTCLOUD_PORT:-8090}:80"
    environment:
      - TZ=${TZ}
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextclouddb
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - PHP_MEMORY_LIMIT=1G
      - PHP_UPLOAD_LIMIT=16G
    volumes:
      # Code, apps and config.php
      - nextcloud_html:/var/www/html
      # Same path as the datadirectory in config.php
      - ${NEXTCLOUD_DATA_DIR:-/var/nextcloud/data}:/var/nextcloud/data
      # HSTS header; the address is HTTPS only
      - ./nextcloud/hsts.conf:/etc/apache2/conf-enabled/hsts.conf:ro
    labels:
      - com.centurylinklabs.watchtower.enable=false

  # Background jobs: runs cron.php every 5 minutes
  nextcloud-cron:
    container_name: nextcloud-cron
    image: nextcloud:${NEXTCLOUD_VERSION}-apache
    restart: unless-stopped
    depends_on:
      - nextcloud
      - nextcloud-redis
    entrypoint: /cron.sh
    environment:
      - TZ=${TZ}
    volumes:
      - nextcloud_html:/var/www/html
      - ${NEXTCLOUD_DATA_DIR:-/var/nextcloud/data}:/var/nextcloud/data
    labels:
      - com.centurylinklabs.watchtower.enable=false

  # ===============================
  # Tailscale (VPN, HTTPS address of Nextcloud)
  # ===============================
  # Runs in the host network, so it behaves like Tailscale installed on the host (the Pi's own
  # Tailscale address, subnet routes). The node identity is the state in the tailscale_state
  # volume; tailscale/serve.json publishes Nextcloud on the node's HTTPS address, and "AllowFunnel"
  # makes that address reachable from the internet (set it to false for tailnet-only).
  tailscale:
    container_name: tailscale
    image: tailscale/tailscale:stable
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      # Only for a node without state (first start); empty otherwise
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      # Keep the existing name: it is part of the node's HTTPS address. Empty = host name.
      - TS_HOSTNAME=${TS_HOSTNAME:-}
      # Networks to offer to the tailnet, e.g. the LAN (comma-separated); empty = none
      - TS_ROUTES=${TS_ROUTES:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=false
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro

  # ===============================
  # Exit node for a guest (optional)
  # ===============================
  # A separate Tailscale node that is shared with one guest, who can send his internet traffic
  # through this house but cannot reach any private network (firewall.sh). Off by default; set
  # COMPOSE_PROFILES=guest-exit in .env and see the README for the Tailscale steps.
  guest-exit:
    container_name: guest-exit
    profiles: ["guest-exit"]
    image: tailscale/tailscale:stable
    restart: unless-stopped
    hostname: ${GUEST_EXIT_HOSTNAME:-guest-exit}
    entrypoint: ["/guest-exit/entrypoint.sh"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    environment:
      - TZ=${TZ}
      # Only needed for the first start; the node's identity is kept in the volume afterwards
      - TS_AUTHKEY=${GUEST_EXIT_AUTHKEY:-}
      - TS_HOSTNAME=${GUEST_EXIT_HOSTNAME:-guest-exit}
      - TS_EXTRA_ARGS=--advertise-exit-node
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=false
      # The host kernel has no legacy iptables tables; without this Tailscale cannot create its
      # forwarding and masquerade rules and the guest gets no internet
      - TS_DEBUG_FIREWALL_MODE=nftables
    volumes:
      - guest_exit_state:/var/lib/tailscale
      - ./guest-exit:/guest-exit:ro

  # ===============================
  # Scheduled jobs (backups, disk health, monitoring and alerts, guest exit traffic, updates check)
  # ===============================
  # Replaces the root crontab on the host. The Docker socket lets the jobs run occ and the database
  # dump in the Nextcloud containers; the state backup needs the service data, the HDD and the
  # home-config clone; the Nextcloud backup reads the data directory (read-only) and writes a
  # restic repository on the HDD; the health check reads the SMART data of the HDD and the SSD.
  # Host network: the monitor checks the ports of the services on the Pi (nothing connects to jobs).
  jobs:
    container_name: jobs
    build: ./jobs
    image: smart-home-jobs:local
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ}
      - NEXTCLOUD_NOTIFY_USER=${NEXTCLOUD_NOTIFY_USER:-}
      - ALERT_SMTP_URL=${ALERT_SMTP_URL:-}
      - ALERT_SMTP_USER=${ALERT_SMTP_USER:-}
      - ALERT_SMTP_PASSWORD=${ALERT_SMTP_PASSWORD:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - MONITOR_PORTS=${MONITOR_PORTS:-mosquitto:1883 nodered:1880 homebridge:8581 samba:445 portainer:9000}
      - GUEST_EXIT_MONTHLY_LIMIT_GB=${GUEST_EXIT_MONTHLY_LIMIT_GB:-0}
      - SSD_SMART_TYPE=${SSD_SMART_TYPE:-sat}
      - RESTIC_REPOSITORY=/hdd/backup/nextcloud-restic
      - RESTIC_PASSWORD=${NEXTCLOUD_BACKUP_PASSWORD:-}
      - HDD_SMART_TYPE=${HDD_SMART_TYPE:-sat}
    # SMART commands through the USB bridge need raw device access
    cap_add:
      - SYS_RAWIO
    devices:
      # Without HDD_DEVICE this maps /dev/null, which the health check recognises as "no HDD"
      - ${HDD_DEVICE:-/dev/null}:/dev/hdd
      - ${SSD_DEVICE:-/dev/null}:/dev/ssd
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR}:/data
      - jobs_state:/state
      - ${NEXTCLOUD_DATA_DIR:-/var/nextcloud/data}:/var/nextcloud/data:ro
      - ${HOME_CONFIG_DIR:-../../home-config}:/home-config:ro
      - ../scripts:/scripts:ro
      - type: bind
        source: ${HDD_DIR}
        target: /hdd
        bind:
          propagation: rslave
          create_host_path: false
    labels:
      - com.centurylinklabs.watchtower.enable=false

  # ===============================
  # Watchtower (Auto-update for containers)
  # ===============================
  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=86400   # check once per day
      # The image is unmaintained and talks API 1.25; Docker 29 refuses anything below 1.40
      - DOCKER_API_VERSION=1.44

  # ===============================
  # Dashboard and trend charts (optional)
  # ===============================
  # Grafana (the one dashboard) on VictoriaMetrics (history, 12 months, small). Off by default;
  # COMPOSE_PROFILES=metrics in .env turns it on. Data comes from node-exporter (host, Pi
  # temperature, disks, the monitor's results), cAdvisor (containers) and mqtt-exporter (Zigbee2MQTT
  # devices). Everything is in the host network and listens on 127.0.0.1 except Grafana, which is
  # on the LAN (GRAFANA_PORT) like Portainer and never behind Funnel. Memory limits keep it small.
  victoriametrics:
    container_name: victoriametrics
    profiles: ["metrics"]
    image: victoriametrics/victoria-metrics:stable
    restart: unless-stopped
    network_mode: host
    mem_limit: 384m
    command:
      - -httpListenAddr=127.0.0.1:8428
      - -storageDataPath=/storage
      - -retentionPeriod=${METRICS_RETENTION:-12}
      - -promscrape.config=/etc/metrics/scrape.yml
    environment:
      - TZ=${TZ}
    volumes:
      - victoriametrics_data:/storage
      - ./metrics/scrape.yml:/etc/metrics/scrape.yml:ro

  grafana:
    container_name: grafana
    profiles: ["metrics"]
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    network_mode: host
    mem_limit: 384m
    depends_on:
      - victoriametrics
    environment:
      - TZ=${TZ}
      - GF_SERVER_HTTP_PORT=${GRAFANA_PORT:-3000}
      # Only used when the Grafana database is created; change it in Grafana afterwards
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/home.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  node-exporter:
    container_name: node-exporter
    profiles: ["metrics"]
    image: prom/node-exporter:latest
    restart: unless-stopped
    network_mode: host
    pid: host
    mem_limit: 64m
    command:
      - --web.listen-address=127.0.0.1:9100
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.loadavg
      - --collector.filesystem
      - --collector.netdev
      - --collector.diskstats
      - --collector.hwmon
      - --collector.thermal_zone
      - --collector.uname
      - --collector.time
      - --collector.stat
      - --collector.textfile
      - --collector.textfile.directory=/state/metrics
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    volumes:
      # rslave: the HDD, when it is mounted after the container started, shows up too
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
      # Results of the monitor and the backups, written by the jobs service
      - jobs_state:/state:ro

  cadvisor:
    container_name: cadvisor
    profiles: ["metrics"]
    image: ghcr.io/google/cadvisor:latest
    restart: unless-stopped
    network_mode: host
    mem_limit: 192m
    command:
      - --listen_ip=127.0.0.1
      - --port=9101
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,referenced_memory,cpu_topology,resctrl,hugetlb,process,memory_numa,disk,diskIO
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  # Zigbee2MQTT devices (state, battery, temperature, availability) as metrics
  mqtt-exporter:
    container_name: mqtt-exporter
    profiles: ["metrics"]
    image: kpetrem/mqtt-exporter:latest
    restart: unless-stopped
    network_mode: host
    mem_limit: 128m
    depends_on:
      - mosquitto
    environment:
      - TZ=${TZ}
      - MQTT_ADDRESS=127.0.0.1
      - MQTT_PORT=1883
      - MQTT_TOPIC=zigbee2mqtt/#
      - MQTT_USERNAME=${MQTT_METRICS_USER:-}
      - MQTT_PASSWORD=${MQTT_METRICS_PASSWORD:-}
      - PROMETHEUS_ADDRESS=127.0.0.1
      - PROMETHEUS_PORT=9344
      - ZIGBEE2MQTT_AVAILABILITY=True
      # A device that stays silent for a day disappears from the charts instead of freezing
      - MQTT_METRICS_EXPIRE_SECONDS=86400

  # ===============================
  # Portainer (Web Docker Management)
  # ===============================
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  grafana_data:
  victoriametrics_data:
  portainer_data:
  nextcloud_db:
  nextcloud_html:
  guest_exit_state:
  jobs_state:
  tailscale_state:
