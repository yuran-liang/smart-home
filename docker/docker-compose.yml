services:
  # ===============================
  # Mosquitto (MQTT broker)
  # ===============================
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2   # Use major version 2 for stability; avoid 'latest' to prevent breaking changes (v3+)
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${DATA_DIR}/mosquitto/config:/mosquitto/config
      - ${DATA_DIR}/mosquitto/data:/mosquitto/data
      - ${DATA_DIR}/mosquitto/log:/mosquitto/log
    environment:
      - TZ=${TZ}

  # ===============================
  # Homebridge (Apple HomeKit bridge)
  # ===============================
  homebridge:
    container_name: homebridge
    image: homebridge/homebridge:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ}
    volumes:
      - ${DATA_DIR}/homebridge:/homebridge
    dns:
      - 1.1.1.1
      - 8.8.8.8

  # ===============================
  # Zigbee2MQTT (Zigbee bridge via Sonoff Dongle MG24)
  # ===============================
  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:latest
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      - TZ=${TZ}
    volumes:
      - ${DATA_DIR}/zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - ${ZIGBEE_DONGLE}:/dev/ttyUSB0

  # ===============================
  # Node-RED (Automation & Flows)
  # ===============================
  # Do not mount anything inside /data/nrchkb: node-red-contrib-homekit-bridged
  # reads every entry there every 2 minutes and crashes Node-RED on a subdirectory.
  nodered:
    container_name: nodered
    image: nodered/node-red:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ}
    volumes:
      - ${DATA_DIR}/nodered/data:/data

  # ===============================
  # Samba (external HDD as a network drive)
  # ===============================
  samba:
    container_name: samba
    image: dockurr/samba
    restart: unless-stopped
    ports:
      - "445:445"
    environment:
      - TZ=${TZ}
      - NAME=${SAMBA_SHARE}
      - USER=${SAMBA_USER}
      - PASS=${SAMBA_PASSWORD:?set SAMBA_PASSWORD in .env}
    volumes:
      # rslave: a mount of the HDD that happens after the container started (e.g. at boot)
      # still shows up inside it. No create_host_path: a missing mount point fails loudly.
      - type: bind
        source: ${HDD_DIR}
        target: /shared
        bind:
          propagation: rslave
          create_host_path: false

  # ===============================
  # Nextcloud (files, with MariaDB)
  # ===============================
  # Not updated by Watchtower: Nextcloud upgrades one major version at a time. Change
  # NEXTCLOUD_VERSION in .env and run `docker compose up -d nextcloud` for each step.
  nextcloud-db:
    container_name: nextcloud-db
    image: mariadb:${NEXTCLOUD_DB_VERSION:-10.6}
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      - TZ=${TZ}
      - MARIADB_ROOT_PASSWORD=${NEXTCLOUD_DB_ROOT_PASSWORD:?set NEXTCLOUD_DB_ROOT_PASSWORD in .env}
      - MARIADB_DATABASE=nextclouddb
      - MARIADB_USER=nextcloud
      - MARIADB_PASSWORD=${NEXTCLOUD_DB_PASSWORD:?set NEXTCLOUD_DB_PASSWORD in .env}
    volumes:
      - nextcloud_db:/var/lib/mysql
    labels:
      - com.centurylinklabs.watchtower.enable=false

  nextcloud:
    container_name: nextcloud
    image: nextcloud:${NEXTCLOUD_VERSION:?set NEXTCLOUD_VERSION in .env}-apache
    restart: unless-stopped
    depends_on:
      - nextcloud-db
    ports:
      - "${NEXTCLOUD_PORT:-8080}:80"
    environment:
      - TZ=${TZ}
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextclouddb
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - PHP_MEMORY_LIMIT=1G
      - PHP_UPLOAD_LIMIT=16G
    volumes:
      # Code, apps and config.php
      - nextcloud_html:/var/www/html
      # Same path as the datadirectory in config.php
      - ${NEXTCLOUD_DATA_DIR:-/var/nextcloud/data}:/var/nextcloud/data
    labels:
      - com.centurylinklabs.watchtower.enable=false

  # Background jobs: runs cron.php every 5 minutes
  nextcloud-cron:
    container_name: nextcloud-cron
    image: nextcloud:${NEXTCLOUD_VERSION}-apache
    restart: unless-stopped
    depends_on:
      - nextcloud
    entrypoint: /cron.sh
    environment:
      - TZ=${TZ}
    volumes:
      - nextcloud_html:/var/www/html
      - ${NEXTCLOUD_DATA_DIR:-/var/nextcloud/data}:/var/nextcloud/data
    labels:
      - com.centurylinklabs.watchtower.enable=false

  # ===============================
  # Watchtower (Auto-update for containers)
  # ===============================
  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=86400   # check once per day
      # The image is unmaintained and talks API 1.25; Docker 29 refuses anything below 1.40
      - DOCKER_API_VERSION=1.44

  # ===============================
  # Portainer (Web Docker Management)
  # ===============================
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
  nextcloud_db:
  nextcloud_html:
