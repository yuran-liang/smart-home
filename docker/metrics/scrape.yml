# What VictoriaMetrics collects (all exporters listen on 127.0.0.1 in the host network).
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
  - job_name: containers
    static_configs:
      - targets: ["127.0.0.1:9101"]
  - job_name: zigbee
    scrape_interval: 60s
    static_configs:
      - targets: ["127.0.0.1:9344"]
